name: Refresh recalls and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # daily, after CPSC's morning publishing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Browser test on a phone-sized screen (sample data, mocked APIs)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run -s data:sample
          python3 -m http.server 5173 -d site >/dev/null 2>&1 &
          sleep 1
          BASE=http://localhost:5173 node test/e2e.mjs
      - name: Download CPSC and FDA recall snapshot
        run: |
          rm -rf site/data
          npm run data
      - name: Check matching quality on the real data
        run: node scripts/eval-matching.mjs --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
